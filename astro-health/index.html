<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>CrewPulse — body weather for astronauts</title>
  <meta name="description" content="A body weather forecast for astronauts: offline health monitoring that predicts the next 3 days, with post-quantum protected sync to ground." />
  <meta name="theme-color" content="#fdfcfc" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#0d0c0b" media="(prefers-color-scheme: dark)" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="icon" href="icons/icon-192.png" sizes="192x192" type="image/png" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="CrewPulse" />
  <meta name="application-name" content="CrewPulse" />
  <link rel="preload" href="fonts/inter-var.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="fonts/geist-mono-var.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="styles.css?v=47" />
</head>
<body>
  <div class="app">
    <aside class="side">
      <div class="brand">
        <img src="icon.svg" alt="" width="32" height="32" />
        <div><strong>CrewPulse</strong><span>by QuantSafe</span></div>
      </div>
      <nav class="nav" id="nav" aria-label="Main">
        <p class="nav-label">Today</p>
        <a href="#today" data-tab="today"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 18h10a4 4 0 0 0 .4-7.98A6 6 0 0 0 5.9 11.6 3.3 3.3 0 0 0 7 18z"/></svg><span>Forecast</span></a>
        <a href="#checkin" data-tab="checkin"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="m8.6 12.4 2.3 2.3 4.6-5"/></svg><span>Check-in</span></a>
        <a href="#band" data-tab="band"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12h4l2.5-5.5 5 11 2.5-5.5h4"/></svg><span>Band</span></a>
        <a href="#support" data-tab="support"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="3.5"/><path d="M6 6l3.5 3.5M18 6l-3.5 3.5M6 18l3.5-3.5M18 18l-3.5-3.5"/></svg><span>Support</span></a>
        <p class="nav-label">Insights</p>
        <a href="#trends" data-tab="trends"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m4 16.5 5-5 4 4 7-7.5"/><path d="M15.5 8H20v4.5"/></svg><span>Trends</span></a>
        <a href="#crew" data-tab="crew"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8.5" r="3.5"/><path d="M5 19.5a7 7 0 0 1 14 0"/></svg><span>Crew</span></a>
        <p class="nav-label">Mission</p>
        <a href="#sync" data-tab="sync"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19.5 12a7.5 7.5 0 0 1-13 5.1M4.5 12a7.5 7.5 0 0 1 13-5.1"/><path d="M17.8 3.5v3.6h-3.6M6.2 20.5v-3.6h3.6"/></svg><span>Sync</span><b class="badge" id="qbadge" hidden></b></a>
        <a href="#about" data-tab="about"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 11v5.5M12 7.8v.1"/></svg><span>About</span></a>
      </nav>
      <button class="btn ghost install-btn" id="installBtn" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11m0 0-4-4m4 4 4-4M5 20h14"/></svg>Install app</button>
      <p class="side-note">Decision support only — not a medical device. Your own data only. Demo Band is simulated.</p>
    </aside>

    <div class="main">
      <header class="top">
        <div class="mission">
          <span class="md" id="mdLabel">Day 1</span>
          <span class="sep">·</span>
          <span id="profileLabel">Your data only</span>
        </div>
        <div class="status-pills">
          <span class="pill" id="offlinePill" title="All data stays on board"><i class="dot ok"></i><span class="lg-only">Works offline</span><span class="sm-only">Offline OK</span></span>
          <span class="pill" id="passPill"><i class="dot"></i>Band not connected</span>
          <button class="pill install-pill" id="installPill" aria-label="Install app" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11m0 0-4-4m4 4 4-4M5 20h14"/></svg><span class="lg-only">Install app</span></button>
        </div>
      </header>

      <div class="crewbar" id="crewbar" role="tablist" aria-label="Crew member"></div>

      <main id="view" tabindex="-1"></main>
    </div>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="js/data.js?v=47"></script>
  <script src="js/engine.js?v=47"></script>
  <script src="js/forecast.js?v=47"></script>
  <script src="js/band.js?v=47"></script>
  <script src="js/support.js?v=47"></script>
  <script src="js/warning.js?v=47"></script>
  <script src="js/charts.js?v=47"></script>
  <script src="js/app.js?v=47"></script>
</body>
</html>
